name: enrich-news

# LLM 增强队列（--enrich-only）：摘要生成 + 摘要/洞察/标题的多语言补译 + 存量标题回填。
# 与 update-news（高频抓取，--no-enrich）拆开的原因：
#   pipeline 单次运行内联全部 LLM 步骤时要 17-38 分钟，GitHub 会把并发组中
#   已有运行时的 schedule 触发静默丢弃，导致「每 10 分钟一次」退化成 1.5-2.5 小时
#   一次且每天出现数小时断流（2026-09-06 实测最后一次成功运行后 3.5h 无触发）。
#   拆分后抓取几分钟跑完不再丢触发，站点分钟级保鲜；本工作流低频消化 LLM 队列。
# 额度：队列函数自带每轮上限（标题回填 150 / 摘要 40 / 补译 MAX_ROWS_PER_RUN），
#       实际调用量随积压收敛，不会空转打爆额度。
on:
  schedule:
    # 每 30 分钟一次，避开整/圆分钟（GitHub 调度高峰）；仅作兜底，
    # 主链路是 CF Worker（scheduler-worker/）→ repository_dispatch（见 OPERATIONS §10）
    - cron: "9,39 * * * *"
  workflow_dispatch:
  # 外部定时器入口：CF Worker 在 UTC 0/30 分那拍 POST /repos/.../dispatches，
  # event_type=run-enrich。需 PAT（Contents: Read and write，非 Actions）+ 非空 User-Agent
  repository_dispatch:
    types: [run-enrich]

concurrency:
  # 与 update-news 同理改固定组：消除 schedule/dispatch 落入不同组后
  # 两路 enrich 并行写同一批队列行（同一条摘要被两个运行重复生成、后写覆盖先写）
  group: news-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    # 2026-09-19 60→90：旧值下每轮 enrich 都跑满 60 分钟被 cancelled（#74–#79 全如此），
    # 队列（标题回译 150 + 摘要 50 + 摘要/洞察/标题多语补译）在商汤网关速率下常超 60 分钟，
    # 从未完整跑完→新文章长期拿不到洞察。上调后给单轮留足完成余量。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run LLM enrichment queues
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # LLM provider：商汤网关（token.sensenova.cn）— 默认 deepseek-v4-flash 主力，sensenova 挂时自动 fallback
          # 详见 pipeline/src/llm.ts
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          SENSENOVA_BASE_URL: ${{ secrets.SENSENOVA_BASE_URL || 'https://token.sensenova.cn/v1' }}
          SENSENOVA_MODEL: ${{ secrets.SENSENOVA_MODEL || 'deepseek-v4-flash' }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'deepseek' }}
          # 以下为 legacy Cloudflare Workers AI（仅 LLM_PROVIDER=workersai 时使用）
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
        run: npx tsx pipeline/src/index.ts --enrich-only
