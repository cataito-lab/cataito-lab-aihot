name: db-backup

# 每日全库备份 → Cloudflare R2。
# 立项理由：2026-09-26 Turso rows-read 超额把整账户的读封掉，而仓库里没有任何 dump 机制，
# 结果是「数据在云上但取不出来」。备份必须落在被封锁的库之外，R2 免费档 10GB 足够。
#
# 一次性准备（控制台）：
#   1. R2 建桶 aihot-backups
#   2. 建一个带 **Account / Workers R2 Storage / Edit** 权限的 API Token，存为 Actions secret `CF_R2_TOKEN`
#      （现有的 CF_AI_API_TOKEN 是 Workers AI 作用域，写不了 R2）
#   3. CF_ACCOUNT_ID 复用已有 secret
# 未配置 CF_R2_TOKEN 时本工作流仍会跑完导出与校验并打印体积，只是跳过上传，便于分步启用。
#
# 不做删除/轮转：备份工作流里出现删除逻辑的风险远大于多占几十 MB。
# 读量代价：全库扫一遍 ≈ 库行数级别，实测 37MB 库每天一次约占月度额度的千分之几。

on:
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:
    inputs:
      keep_local:
        description: "只导出不上传（调试用）"
        required: false
        default: "false"

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dump database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx pipeline/scripts/db-dump.ts --out .dump

      - name: Pack
        run: |
          tar czf "aihot-db-${GITHUB_RUN_NUMBER}.tar.gz" -C .dump .
          ls -lh aihot-db-*.tar.gz
          echo "ARCHIVE=aihot-db-${GITHUB_RUN_NUMBER}.tar.gz" >> "$GITHUB_ENV"

      - name: Detect R2 credentials
        id: r2
        env:
          CF_R2_TOKEN: ${{ secrets.CF_R2_TOKEN }}
        # secrets 上下文在 step 级 if: 里不可靠，先落成 output 再判断
        run: echo "enabled=$([ -n "$CF_R2_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload to R2
        if: steps.r2.outputs.enabled == 'true' && github.event.inputs.keep_local != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          DAY="$(date -u +%F)"
          npx --yes wrangler@4 r2 object put "aihot-backups/${DAY}/${ARCHIVE}" \
            --file "$ARCHIVE" --content-type application/gzip
          # 同时覆盖一份 latest，恢复时不用先去翻日期目录
          npx --yes wrangler@4 r2 object put "aihot-backups/latest/${ARCHIVE}" \
            --file "$ARCHIVE" --content-type application/gzip

      - name: Skip notice
        if: steps.r2.outputs.enabled != 'true'
        run: echo "::warning::未配置 CF_R2_TOKEN，本次只导出未上传。R2 建桶 + 加 secret 后自动启用。"
