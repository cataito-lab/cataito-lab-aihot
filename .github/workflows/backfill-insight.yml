name: backfill-insight

# 手动触发：用新版「AI Insight 智能洞察」提示词，回填历史文章的结构化洞察。
# 幂等：只处理 importance_score IS NULL 的文章（2026-08-27 由 key_change IS NULL 改为按评分缺口判定）；跑完（pending 归零）自动重聚类。
# 吞吐：并发池 5 路，400 条约 15 分钟跑完；累计上限 BACKFILL_INSIGHT_MAX（默认 400）避免击穿网关速率或跑超时。
#       若积压超出单次上限，分多次触发即可，每次自动续跑剩余部分。
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: "单次运行最大模型调用次数（并发池模式下 400 条约 15min）"
        required: false
        default: "400"
      no_recluster:
        description: "完成时跳过重聚类（仅部分回填时设为 true）"
        required: false
        default: "false"
      dry_run:
        description: "只统计待处理数量，不调用模型、不写库"
        required: false
        default: "false"

concurrency:
  group: news-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 60→90：并发池（默认 5 路）可在 ~15min 内跑完 400 条，但网络抖动/429 退避留余量
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Backfill AI Insight for historical articles
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # LLM 容灾链（跨厂商）：Gemini 免费档主力 → 商汤网关 → Workers AI 兜底（见 pipeline/src/llm.ts）
          # 并发池 5 路；Gemini 免费档 RPM 低，429 时链内自动切换 provider
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          SENSENOVA_BASE_URL: ${{ secrets.SENSENOVA_BASE_URL || 'https://token.sensenova.cn/v1' }}
          SENSENOVA_MODEL: ${{ secrets.SENSENOVA_MODEL || 'deepseek-v4-flash' }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          # Cloudflare Workers AI 兜底（链尾，需 CF_* 凭据）
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
          BACKFILL_INSIGHT_MAX: ${{ github.event.inputs.max_calls }}
          BACKFILL_INSIGHT_CONCURRENCY: "5"
        run: >-
          npx tsx pipeline/scripts/backfill-insight.ts
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          ${{ github.event.inputs.no_recluster == 'true' && '--no-recluster' || '' }}
