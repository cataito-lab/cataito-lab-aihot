name: update-news

on:
  schedule:
    # 每 10 分钟一次；公开仓库 Actions 分钟免费，不占配额
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: news-pipeline
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run news pipeline
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # LLM provider：Gemini 2.5 Flash 主力 + 智谱 GLM-4-Flash 兜底（详见 pipeline/src/llm.ts）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          LLM_PROVIDER: "gemini"
          # 以下为 legacy Cloudflare Workers AI（仅 LLM_PROVIDER=workersai 时使用）
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
        run: npx tsx pipeline/src/index.ts --window-hours 24
