name: update-news

on:
  schedule:
    # 8:00-22:00 每小时一次，节省 GitHub Actions 配额（免费层 2000 分钟/月）
    - cron: "0 8-22 * * *"
  workflow_dispatch:

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run news pipeline
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
        run: npx tsx pipeline/src/index.ts --window-hours 24
