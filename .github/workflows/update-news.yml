name: update-news

on:
  schedule:
    # 每 10 分钟一次；公开仓库 Actions 分钟免费，不占配额
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  # 单一队列：schedule 与 workflow_dispatch 共享同一组，避免互相掐
  group: news-pipeline
  # 正在跑就排队等，不 cancel——pipeline 要 10-15 分钟，cancel 会导致 finished_at 永远 null
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run news pipeline
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # LLM provider：商汤网关（token.sensenova.cn）— 默认 deepseek-v4-flash 主力，sensenova 挂时自动 fallback
          # 详见 pipeline/src/llm.ts
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          SENSENOVA_BASE_URL: ${{ secrets.SENSENOVA_BASE_URL || 'https://token.sensenova.cn/v1' }}
          SENSENOVA_MODEL: ${{ secrets.SENSENOVA_MODEL || 'deepseek-v4-flash' }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'deepseek' }}
          # 以下为 legacy Cloudflare Workers AI（仅 LLM_PROVIDER=workersai 时使用）
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
        run: npx tsx pipeline/src/index.ts --window-hours 24
